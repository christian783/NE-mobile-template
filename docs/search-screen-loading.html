<!DOCTYPE html>

<html class="dark" lang="en"><head>

<style>
    @keyframes bounce-delay {
        0%, 80%, 100% { transform: translateY(0); }
        40% { transform: translateY(-10px); }
    }
    .loading-dot {
        animation: bounce-delay 1.4s infinite ease-in-out both;
    }
    .loading-dot:nth-child(1) { animation-delay: -0.32s; }
    .loading-dot:nth-child(2) { animation-delay: -0.16s; }
    .loading-dot:nth-child(3) { animation-delay: 0s; }
</style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background antialiased flex justify-center items-center min-h-screen">
<!-- iPhone 14 Frame Container -->
<div class="relative w-full max-w-[390px] h-[844px] bg-background overflow-hidden border border-surface-container-high md:rounded-[40px] md:shadow-2xl shadow-none">
<!-- TopAppBar -->
<header class="bg-background text-primary font-headline-md text-headline-md flex justify-between items-center w-full px-container-margin h-16 sticky top-0 z-10">
<button class="text-on-surface-variant hover:bg-surface-container transition-colors duration-200 ease-in-out p-2 rounded-full focus:outline-none">
<span class="material-symbols-outlined" data-icon="menu">menu</span>
</button>
<h1 class="font-display-word-mobile text-display-word-mobile font-bold text-on-background">LexiDict</h1>
<button class="text-primary hover:bg-surface-container transition-colors duration-200 ease-in-out p-2 rounded-full focus:outline-none">
<span class="material-symbols-outlined" data-icon="search">search</span>
</button>
</header>
<!-- Main Content Area -->
<main class="px-container-margin py-lg h-[calc(100%-64px)] flex flex-col">
<!-- Search Input Section -->
<div class="relative w-full mb-huge">
<div class="flex items-center bg-[#1A1A1A] border border-[#2A2A2A] rounded-lg px-4 py-3 shadow-sm focus-within:border-primary transition-colors">
<span class="material-symbols-outlined text-outline mr-3" data-icon="search">search</span>
<input class="w-full bg-transparent border-none focus:ring-0 text-on-surface font-phonetic-mono text-phonetic-mono placeholder-outline outline-none disabled:opacity-75" disabled="" placeholder="Search LexiDict..." type="text" value="ephemeral"/>
<button class="ml-2 text-primary opacity-50 cursor-not-allowed" disabled="">
<span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
</div>
<!-- Loading State Overlay/Centered Area -->
<div class="flex-grow flex flex-col items-center justify-center -mt-20">
<!-- Bouncing Dots -->
<div class="flex space-x-2 mb-sm">
<div class="w-3 h-3 bg-primary-container rounded-full loading-dot"></div>
<div class="w-3 h-3 bg-primary-container rounded-full loading-dot"></div>
<div class="w-3 h-3 bg-primary-container rounded-full loading-dot"></div>
</div>
<!-- Loading Text -->
<p class="font-helper-text text-helper-text text-[#9CA3AF]">Looking up your word...</p>
</div>
</main>
<!-- NavigationDrawer (Hidden on Mobile by default, included for structural completeness based on JSON) -->
<nav class="hidden fixed inset-y-0 left-0 z-50 flex-col py-lg bg-surface-container text-primary h-full w-80 rounded-r-xl border-r border-outline-variant shadow-huge transition-all duration-300 ease-in-out">
<!-- Header -->
<div class="px-lg pb-md border-b border-outline-variant mb-md flex items-center">
<div class="w-12 h-12 rounded-full bg-surface-bright flex items-center justify-center mr-4">
<span class="material-symbols-outlined text-on-surface" data-icon="person">person</span>
</div>
<div>
<h2 class="font-headline-md text-headline-md text-on-surface">LexiDict</h2>
<p class="font-helper-text text-helper-text text-on-surface-variant">Premium Lexicon</p>
<p class="font-helper-text text-[10px] text-outline mt-1">v1.0.4</p>
</div>
</div>
<!-- Links -->
<div class="flex-grow">
<!-- Search (Active intent based on screen description) -->
<a class="flex items-center px-lg py-3 bg-secondary-container text-on-secondary-container rounded-full mx-2 mb-1 hover:bg-surface-bright transition-all duration-300 ease-in-out" href="#">
<span class="material-symbols-outlined mr-4" data-icon="search">search</span>
<span class="font-helper-text text-helper-text">Search</span>
</a>
<a class="flex items-center px-lg py-3 text-on-surface-variant mx-2 mb-1 hover:bg-surface-bright transition-all duration-300 ease-in-out rounded-full" href="#">
<span class="material-symbols-outlined mr-4" data-icon="history">history</span>
<span class="font-helper-text text-helper-text">History</span>
</a>
<a class="flex items-center px-lg py-3 text-on-surface-variant mx-2 mb-1 hover:bg-surface-bright transition-all duration-300 ease-in-out rounded-full" href="#">
<span class="material-symbols-outlined mr-4" data-icon="bookmark">bookmark</span>
<span class="font-helper-text text-helper-text">Favorites</span>
</a>
<a class="flex items-center px-lg py-3 text-on-surface-variant mx-2 mb-1 hover:bg-surface-bright transition-all duration-300 ease-in-out rounded-full" href="#">
<span class="material-symbols-outlined mr-4" data-icon="settings">settings</span>
<span class="font-helper-text text-helper-text">Settings</span>
</a>
</div>
</nav>
</div>
</body></html>
