<html class="dark" lang="en"><head>

            darkMode: "class",

                extend: {
                    "colors": {

                        "tertiary-fixed-dim": "#45dfa4",
                        "surface-container-low": "#1a1c1c",
                        "on-error": "#690005",
                        "secondary": "#cebdff",
                        "surface": "#121414",
                        "on-background": "#e2e2e2",
                        "on-tertiary-fixed": "#002114",
                        "on-secondary-fixed": "#21005e",
                        "tertiary-container": "#00a574",
                        "on-surface": "#e2e2e2",
                        "background": "#121414",
                        "surface-bright": "#38393a",
                        "secondary-fixed": "#e8ddff",
                        "error": "#ffb4ab",
                        "on-primary-fixed-variant": "#004492",
                        "on-tertiary-fixed-variant": "#005137",
                        "on-primary-container": "#00285b",
                        "on-primary": "#002f68",
                        "surface-container-lowest": "#0c0f0f",
                        "outline": "#8c909e",
                        "on-secondary-container": "#bea8ff",
                        "outline-variant": "#424753",
                        "primary-container": "#508ff8",
                        "surface-dim": "#121414",
                        "on-primary-fixed": "#001a40",
                        "surface-container-highest": "#333535",
                        "surface-variant": "#333535",
                        "tertiary": "#45dfa4",
                        "surface-container-high": "#282a2b",
                        "primary": "#acc7ff",
                        "on-error-container": "#ffdad6",
                        "inverse-primary": "#005bbf",
                        "on-tertiary-container": "#003120",
                        "on-secondary": "#381385",
                        "surface-tint": "#acc7ff",
                        "secondary-container": "#4f319c",
                        "primary-fixed-dim": "#acc7ff",
                        "secondary-fixed-dim": "#cebdff",
                        "primary-fixed": "#d7e2ff",
                        "tertiary-fixed": "#68fcbf",
                        "inverse-surface": "#e2e2e2",
                        "surface-container": "#1e2020",
                        "on-secondary-fixed-variant": "#4f319c",
                        "on-surface-variant": "#c2c6d5"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",

                    "spacing": {

                        "xl": "32px",

                        "gutter": "16px",
                        "md": "16px",
                        "huge": "48px",
                        "xs": "8px",
                        "sm": "12px"
                    },
                    "fontFamily": {
                        "headline-md": ["DM Sans"],
                        "display-word": ["Playfair Display"],
                        "label-caps": ["DM Sans"],
                        "display-word-mobile": ["Playfair Display"],
                        "phonetic-mono": ["JetBrains Mono"],
                        "helper-text": ["DM Sans"],
                        "definition-body": ["DM Sans"]
                    },
                    "fontSize": {
                        "headline-md": ["20px", { "lineHeight": "28px", "fontWeight": "700" }],
                        "display-word": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700" }],

                    }

            }

<style>
        body {
            background-color: theme('colors.background');
            color: theme('colors.on-background');
            -webkit-tap-highlight-color: transparent;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="antialiased flex items-center justify-center min-h-screen">
<div class="relative w-full max-w-[390px] h-[844px] bg-background overflow-hidden flex flex-col mx-auto border border-outline-variant rounded-[40px] shadow-2xl">
<header class="flex justify-between items-center w-full px-container-margin h-16 bg-background text-primary docked full-width top-0 transition-colors duration-200 ease-in-out shrink-0 z-10 relative">
<button aria-label="Open menu" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container transition-colors">
<span class="material-symbols-outlined text-primary text-[24px]">menu</span>
</button>
<h1 class="font-display-word-mobile text-display-word-mobile font-bold text-on-background truncate">LexiDict</h1>
<button aria-label="Search" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container transition-colors">
<span class="material-symbols-outlined text-primary text-[24px]">search</span>
</button>
</header>
<main class="flex-1 flex flex-col justify-center px-container-margin pb-huge pt-lg z-0 relative overflow-y-auto">
<div class="mb-huge relative pl-sm border-l-4 border-primary">
<p class="font-display-word-mobile text-[32px] leading-[40px] italic font-medium text-outline-variant">
                    "The dictionary is the universe in alphabetical order."
                </p>
<p class="mt-sm font-helper-text text-helper-text text-on-surface-variant">
                    Search any English word to explore its meaning.
                </p>
</div>
<div class="relative w-full group">
<div class="absolute inset-y-0 left-0 pl-sm flex items-center pointer-events-none">
<span class="material-symbols-outlined text-primary text-[20px]">search</span>
</div>
<input autocomplete="off" class="w-full bg-surface-container-low border border-outline-variant text-on-surface font-phonetic-mono text-phonetic-mono rounded-xl py-sm pl-[44px] pr-[52px] focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all shadow-sm placeholder:text-outline placeholder:font-phonetic-mono" placeholder="Search a word..." type="text"/>
<div class="absolute inset-y-0 right-1 flex items-center">
<button class="w-8 h-8 rounded-full bg-primary flex items-center justify-center hover:bg-inverse-primary transition-colors focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-background">
<span class="material-symbols-outlined text-on-primary text-[18px]">arrow_forward</span>
</button>
</div>
</div>
<div class="mt-huge text-center absolute bottom-[100px] left-0 w-full px-container-margin">
<p class="font-helper-text text-[12px] text-on-surface-variant flex items-center justify-center gap-xs">
<span class="material-symbols-outlined text-[14px]">info</span>
                    Tap the menu to revisit past searches
                </p>
</div>
</main>
<div class="fixed inset-y-0 left-0 z-50 flex flex-col py-lg bg-surface-container text-primary h-full w-80 rounded-r-xl border-r border-outline-variant shadow-huge transition-transform duration-300 ease-in-out -translate-x-full md:hidden" id="nav-drawer">
<div class="px-container-margin mb-lg flex items-center gap-sm">
<div class="w-12 h-12 rounded-full bg-primary-container flex items-center justify-center text-on-primary-container font-headline-md text-headline-md">L</div>
<div>
<h2 class="font-display-word-mobile text-[24px] font-bold text-on-surface leading-tight">LexiDict</h2>
<p class="font-helper-text text-helper-text text-on-surface-variant">Premium Lexicon</p>
</div>
</div>
<nav class="flex-1 flex flex-col gap-base px-sm">
<a class="flex items-center gap-sm px-md py-sm bg-secondary-container text-on-secondary-container rounded-full mx-2 font-helper-text text-helper-text font-medium transition-all hover:bg-surface-bright" href="#">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">search</span>
                    Search
                </a>
<a class="flex items-center gap-sm px-md py-sm text-on-surface-variant rounded-full mx-2 font-helper-text text-helper-text transition-all hover:bg-surface-bright" href="#">
<span class="material-symbols-outlined text-[20px]">history</span>
                    History
                </a>
<a class="flex items-center gap-sm px-md py-sm text-on-surface-variant rounded-full mx-2 font-helper-text text-helper-text transition-all hover:bg-surface-bright" href="#">
<span class="material-symbols-outlined text-[20px]">bookmark</span>
                    Favorites
                </a>
<a class="flex items-center gap-sm px-md py-sm text-on-surface-variant rounded-full mx-2 font-helper-text text-helper-text transition-all hover:bg-surface-bright mt-auto mb-md" href="#">
<span class="material-symbols-outlined text-[20px]">settings</span>
                    Settings
                </a>
</nav>
</div>
<div class="fixed inset-0 bg-black/50 z-40 hidden transition-opacity opacity-0 md:hidden" id="drawer-overlay"></div>
</div>
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const menuBtn = document.querySelector('header button[aria-label="Open menu"]');
            const drawer = document.getElementById('nav-drawer');
            const overlay = document.getElementById('drawer-overlay');

            function toggleDrawer() {
                const isOpen = !drawer.classList.contains('-translate-x-full');
                
                if (isOpen) {
                    drawer.classList.add('-translate-x-full');
                    overlay.classList.remove('opacity-100');
                    setTimeout(() => overlay.classList.add('hidden'), 300);
                } else {
                    overlay.classList.remove('hidden');
                    // Small delay to allow display:block to apply before animating opacity
                    setTimeout(() => {
                        overlay.classList.add('opacity-100');
                        drawer.classList.remove('-translate-x-full');
                    }, 10);
                }
            }

            if (menuBtn && drawer && overlay) {
                menuBtn.addEventListener('click', toggleDrawer);
                overlay.addEventListener('click', toggleDrawer);
            }
        });
    </script>
</body></html>
