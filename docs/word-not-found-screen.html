<!DOCTYPE html>

<meta charset="utf-8"/>

<style>
        .material-symbols-outlined {
          font-variation-settings:
          'FILL' 0,
          'wght' 400,
          'GRAD' 0,
          'opsz' 24
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-headline-md antialiased selection:bg-primary-container selection:text-on-primary-container">
<!-- TopAppBar -->
<header class="bg-background dark:bg-background text-primary dark:text-primary docked full-width top-0 bg-background dark:bg-background transition-colors duration-200 ease-in-out flex justify-between items-center w-full px-container-margin h-16 z-10 sticky">
<button aria-label="menu" class="w-10 h-10 flex items-center justify-center rounded-full text-on-surface-variant dark:text-on-surface-variant hover:bg-surface-container dark:hover:bg-surface-container transition-colors duration-200 ease-in-out">
<span class="material-symbols-outlined" data-icon="menu">menu</span>
</button>
<div class="font-display-word-mobile text-display-word-mobile font-bold text-on-background dark:text-on-background flex-1 text-center">
            LexiDict
        </div>
<button aria-label="search" class="w-10 h-10 flex items-center justify-center rounded-full text-on-surface-variant dark:text-on-surface-variant hover:bg-surface-container dark:hover:bg-surface-container transition-colors duration-200 ease-in-out">
<span class="material-symbols-outlined" data-icon="search">search</span>
</button>
</header>
<!-- Main Content Canvas (404 Error State) -->
<main class="flex-1 flex flex-col items-center justify-center px-container-margin w-full max-w-md mx-auto">
<!-- Error Icon Element -->
<div class="w-[90px] h-[90px] rounded-full bg-surface-container-low flex items-center justify-center mb-lg shadow-sm border border-outline-variant/30">
<span class="material-symbols-outlined text-[40px] text-error" data-icon="search_off" style="font-variation-settings: 'FILL' 1;">search_off</span>
</div>
<!-- Typography Cluster -->
<h1 class="font-display-word-mobile text-display-word-mobile text-on-surface text-center mb-sm leading-tight">
            Word Not Found
        </h1>
<p class="font-helper-text text-helper-text text-on-surface-variant text-center max-w-[280px] mx-auto mb-xl">
            We couldn't find a definition for this word. Check the spelling and try again.
        </p>
<!-- Action Area -->
<div class="w-full">
<button class="w-full bg-primary text-on-primary py-4 rounded-lg font-headline-md text-headline-md transition-all duration-300 ease-in-out hover:bg-primary-fixed hover:text-on-primary-fixed hover:shadow-lg active:scale-[0.98] flex items-center justify-center gap-2">
<span>Try Again</span>
<span class="material-symbols-outlined text-[20px]" data-icon="refresh">refresh</span>
</button>
</div>
</main>
</body></html>
