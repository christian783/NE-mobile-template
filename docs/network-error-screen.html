<body class="bg-background text-on-background antialiased min-h-screen flex items-center justify-center p-container-margin selection:bg-primary-container selection:text-on-primary-container">
<!-- Mobile Frame Container -->
<main class="w-full max-w-md mx-auto h-full min-h-[600px] flex flex-col items-center justify-center relative bg-surface-dim rounded-xl overflow-hidden border border-outline-variant shadow-huge px-container-margin">
<!-- Animated Background Glow -->
<div class="absolute inset-0 z-0 overflow-hidden pointer-events-none">
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-64 h-64 bg-error rounded-full opacity-5 blur-[100px]"></div>
</div>
<!-- Content Canvas -->
<div class="relative z-10 flex flex-col items-center w-full max-w-[280px]">
<!-- Icon -->
<div class="w-[90px] h-[90px] rounded-full bg-surface-container-low border border-outline-variant flex items-center justify-center mb-xl shadow-lg relative">
<div class="absolute inset-0 rounded-full border border-error opacity-20 animate-ping"></div>
<span class="material-symbols-outlined text-error" data-icon="wifi_off" style="font-size: 40px; font-variation-settings: 'FILL' 1;">wifi_off</span>
</div>
<!-- Typography -->
<h1 class="font-headline-md text-headline-md text-on-background mb-sm text-center">
                Network Error
            </h1>
<p class="font-helper-text text-helper-text text-on-surface-variant text-center mb-huge">
                No internet connection. Please check your network and try again.
            </p>
<!-- Action -->
<button class="w-full bg-primary-container text-on-primary-container font-headline-md text-headline-md rounded-lg py-sm px-lg flex items-center justify-center gap-xs hover:bg-primary transition-colors duration-200 active:scale-95 group" type="button">
<span class="material-symbols-outlined text-on-primary-container group-hover:animate-spin-slow" data-icon="refresh" style="font-size: 20px;">refresh</span>
<span>Try Again</span>
</button>
</div>
</main>
<script>
        // Simple interaction for the retry button
        document.querySelector('button').addEventListener('click', function(e) {
            const btn = e.currentTarget;
            const icon = btn.querySelector('.material-symbols-outlined');
            icon.classList.add('animate-spin');
            
            // Simulate network check
            setTimeout(() => {
                icon.classList.remove('animate-spin');
            }, 1000);
        });
    </script>
